# External Brain — single-server stack.
#
# One self-hosted server, one Compose file. Long-running edge services
# (Caddy TLS terminator, Redis, nightly backup) live behind the `edge`
# profile so a bare local `docker compose up` brings up only the core
# (db · web · mcp-server · worker) with dev-friendly defaults, while the
# server deploy activates `--profile edge` via scripts/deploy.sh.
#
# Local dev:
#   cp .env.example .env      # fill in OPENAI_API_KEY and/or ANTHROPIC_API_KEY
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#
# Server deploy (TLS, backups, lockdown audit, smoke):
#   ./scripts/deploy.sh
#
# Server prereqs (the `edge` profile):
#   1. DNS A records for $BRAIN_PUBLIC_HOSTNAME and $BRAIN_MCP_PUBLIC_HOSTNAME
#      pointing at this host's public IP.
#   2. Ports 80 and 443 open (ACME HTTP-01 + HTTPS).
#   3. `.env` carries BRAIN_PUBLIC_HOSTNAME, BRAIN_MCP_PUBLIC_HOSTNAME,
#      CADDY_EMAIL, real auth (AUTH_* / ADMIN_*), and ALLOW_DEV_AUTH=false
#      (scripts/deploy.sh refuses the dev-auth shim on the server).

services:
  # Per-service log retention (#56 gap 1): the `logging:` block bounds the
  # in-container buffer to 50 MB (10 MB × 5); scripts/save-deploy-logs.sh
  # snapshots live logs to ./logs/snapshots/<timestamp>/ before any reload.

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
    ports:
      # Bind to loopback only — Postgres must never be reachable from the
      # public internet (CERT-Bund/BSI flags open :5432). The app containers
      # reach it over the internal Docker network as `db:5432`, so the host
      # mapping only exists for local dev tooling. Override POSTGRES_HOST_BIND
      # if you need a different bind address; never use 0.0.0.0.
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - brain_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brain}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        # Stamps NEXT_PUBLIC_APP_VERSION into the bundle for the rail-footer
        # version label. deploy.sh exports APP_VERSION from `git describe`;
        # defaults to "dev" for a bare local build.
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-production}
      DEV_USER_ID: ${DEV_USER_ID:-}
      # Auth-hardening (2026-04-23): unconfigured deployments must EITHER
      # set AUTH_GITHUB_* + AUTH_SECRET for OAuth, OR set ALLOW_DEV_AUTH=true
      # for a local/VPN-only demo. Default "true" so a bare local `up` boots
      # usable; scripts/deploy.sh REFUSES ALLOW_DEV_AUTH=true on the server,
      # so the one server must set it false + configure real auth in .env.
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}
      ALLOW_DEV_AUTH_IN_PRODUCTION: ${ALLOW_DEV_AUTH_IN_PRODUCTION:-true}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REGISTRATION_REQUIRES_VOUCHER: ${REGISTRATION_REQUIRES_VOUCHER:-true}
      # Default to the public HTTPS origin when BRAIN_PUBLIC_HOSTNAME is set
      # (server); empty otherwise (local) so NextAuth uses the request host.
      AUTH_URL: ${AUTH_URL:-}
      # Public hostnames consumed by the installer / skill / wizard
      # endpoints (apps/web/lib/brain/skill-template.ts::publicUrlsFromEnv).
      # Without these the generated installer hard-codes
      # http://localhost:3100/mcp, which is wrong on any deployment a
      # remote client would talk to. Default-empty so a localhost-only
      # `pnpm turbo run dev` still works; set BOTH on any TLS-fronted
      # deploy so the generated `claude mcp add` URL is the public HTTPS one.
      BRAIN_PUBLIC_HOSTNAME: ${BRAIN_PUBLIC_HOSTNAME:-}
      BRAIN_MCP_PUBLIC_HOSTNAME: ${BRAIN_MCP_PUBLIC_HOSTNAME:-}
      # Required on non-localhost deployments (any URL except 127.0.0.1 /
      # localhost) or NextAuth refuses the host header with "There was a
      # problem with the server configuration." Kept default-on because
      # auth.ts also sets trustHost: true; the env var belt-and-braces
      # matches what NextAuth looks for at module load.
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      # Credentials-mode admin login (phase-1 pilot default). See
      # docs/SECURITY.md §"Credentials mode". Generate the hash via
      # `pnpm hash-admin-password '<plaintext>'`.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      # Legacy singular — kept here to preserve backward-compat with
      # existing .env files. The web service reads ADMIN_EMAILS first
      # and falls back to ADMIN_EMAIL with a one-time deprecation warning
      # (#39). Remove this line once all operator .envs are migrated.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ORACLE_MODEL: ${ORACLE_MODEL:-claude-sonnet-4-6}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      # Operator kill-switch (#56 gap 3) — flip to "false" to take Oracle
      # offline without blocking the rest of the app. Read at request time.
      ORACLE_ENABLED: ${ORACLE_ENABLED:-true}
      RATE_LIMIT_ORACLE_PER_DAY: ${RATE_LIMIT_ORACLE_PER_DAY:-100}
      RATE_LIMIT_KEA_PER_HOUR: ${RATE_LIMIT_KEA_PER_HOUR:-60}
      RATE_LIMIT_MCP_PER_MINUTE: ${RATE_LIMIT_MCP_PER_MINUTE:-200}
      MAX_ORACLE_COST_USD_PER_DAY: ${MAX_ORACLE_COST_USD_PER_DAY:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Empty default → in-process rate-limit state (fine for local/single).
      # On the server set REDIS_URL=redis://redis:6379 and run --profile edge.
      REDIS_URL: ${REDIS_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    ports:
      # Loopback by default — public access is via Caddy (TLS, :443), not the
      # plain-HTTP host port. Override WEB_HOST_BIND only if you front it
      # another way; never serve plain HTTP on 0.0.0.0 in production.
      - "${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    volumes:
      # Read-only: lets GET /api/admin/backup-status stat the replicate
      # heartbeat written by the `backup`/`backup-replicate` services.
      - brain_backups:/data/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mcp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: mcp-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_TRANSPORT: http
      MCP_SERVER_HTTP_PORT: 3100
      # Operator kill-switch (#56 gap 3) — flip to "false" to take MCP
      # offline without losing /health. Read at request time.
      MCP_ENABLED: ${MCP_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ORACLE_MODEL: ${ORACLE_MODEL:-claude-sonnet-4-6}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Needed for the no-auth GET / landing page introduced in #9 — the
      # JSON response includes deep links to the webapp's /docs + /welcome
      # so a developer pasting the MCP hostname in a browser has somewhere
      # to go. Empty default → those fields render as null (graceful).
      BRAIN_PUBLIC_HOSTNAME: ${BRAIN_PUBLIC_HOSTNAME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    ports:
      # Loopback by default — MCP must be reached over TLS via Caddy, never
      # plain HTTP on a public interface (a misrouted client would send its
      # Bearer token in cleartext). Override MCP_HOST_BIND only behind a proxy.
      - "${MCP_HOST_BIND:-127.0.0.1}:${MCP_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3100/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ORACLE_MODEL: ${ORACLE_MODEL:-claude-sonnet-4-6}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      PG_BOSS_SCHEMA: ${PG_BOSS_SCHEMA:-pgboss}
      KEA_ENABLED: ${KEA_ENABLED:-true}
      # KEA_MODEL routes to a provider in packages/core/src/kea.ts:
      #   qwen*/glm* → DashScope (needs DASHSCOPE_API_KEY)
      #   claude*    → Anthropic   (needs ANTHROPIC_API_KEY)
      #   anything else → OpenAI   (needs OPENAI_API_KEY)
      # Default is qwen3-coder for cost reasons; falls back to claude-haiku-4-5
      # if the operator hasn't minted a DashScope key. The worker previously
      # didn't pass this var through, silently ignoring .env overrides.
      KEA_MODEL: ${KEA_MODEL:-qwen3-coder}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AUTOSKILL_ENABLED: ${AUTOSKILL_ENABLED:-true}
      # Autoskill LLM classifier (packages/core/src/autoskill-classifier.ts).
      # Both flags default off → the worker makes ZERO extra LLM calls
      # (cost-neutral). Without these passthroughs a .env override is silently
      # ignored — the same trap as KEA_MODEL above (#212-class).
      AUTOSKILL_LLM_CLASSIFIER: ${AUTOSKILL_LLM_CLASSIFIER:-false}
      AUTOSKILL_SHADOW: ${AUTOSKILL_SHADOW:-false}
      AUTOSKILL_MODEL: ${AUTOSKILL_MODEL:-}
      AUTOSKILL_CLASSIFY_MAX: ${AUTOSKILL_CLASSIFY_MAX:-12}
      AUTOSKILL_FEWSHOT_TOKEN_BUDGET: ${AUTOSKILL_FEWSHOT_TOKEN_BUDGET:-1500}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # One-shot bootstrap container: runs migrations + FTS index.
  # Invoked by scripts/deploy.sh; do not depend on it in long-running services.
  bootstrap:
    profiles: ["bootstrap"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: base
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
    working_dir: /repo
    entrypoint: ["/bin/sh", "-c"]
    # The scripts/deploy.sh orchestrator invokes individual subcommands via
    # `docker compose run --rm bootstrap '<cmd>'`.

  # ───────── edge profile (server only) ─────────
  # Redis, nightly backup, and the hardened Caddy TLS terminator. Activated
  # by scripts/deploy.sh with `--profile edge`. A bare local `docker compose
  # up` skips all of these, so localhost dev needs no TLS/redis/backup.

  # Redis for cross-replica rate-limit state. Single-instance is fine for a
  # bare-VM deploy; scale to managed Redis if you ever go multi-host.
  redis:
    profiles: ["edge"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    volumes:
      - brain_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nightly pg_dump via cron → brain_backups volume. Restore: scripts/backup-restore.sh
  backup:
    profiles: ["edge"]
    image: prodrigestivill/postgres-backup-local:15
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - brain_backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-brain}
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      SCHEDULE: "0 3 * * *"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"

  # Off-host backup replication — opt-in via the `backup-replicate` profile
  # (in addition to `edge`). Syncs brain_backups to a remote rclone backend.
  # See docs for setup (deploy/rclone.conf, BACKUP_REMOTE).
  backup-replicate:
    profiles: ["backup-replicate"]
    image: rclone/rclone:1
    restart: unless-stopped
    depends_on:
      backup:
        condition: service_started
    volumes:
      - brain_backups:/data/backups:ro
      - ./rclone.conf:/config/rclone/rclone.conf:ro
    environment:
      RCLONE_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_INTERVAL: ${BACKUP_INTERVAL:-3600}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          if [ -n "$$RCLONE_REMOTE" ]; then
            rclone sync /data/backups "$$RCLONE_REMOTE" --quiet \
              && echo "$$(date -u): synced to $$RCLONE_REMOTE" \
              || echo "$$(date -u): sync FAILED to $$RCLONE_REMOTE" >&2
            echo "$$(date -u +%s)" > /data/backups/.replicate-heartbeat 2>/dev/null || true
          else
            echo "$$(date -u): RCLONE_REMOTE not set — skipping sync"
          fi
          sleep "$$RCLONE_INTERVAL"
        done

  # Hardened Caddy with the mholt/caddy-ratelimit plugin baked in (the prod
  # Caddyfile uses `rate_limit`, absent from stock caddy:2-alpine). See
  # deploy/Caddyfile.Dockerfile (xcaddy --with github.com/mholt/caddy-ratelimit).
  caddy:
    profiles: ["edge"]
    build:
      context: ..
      dockerfile: deploy/Caddyfile.Dockerfile
    image: brain/caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"      # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      BRAIN_PUBLIC_HOSTNAME: ${BRAIN_PUBLIC_HOSTNAME}
      BRAIN_MCP_PUBLIC_HOSTNAME: ${BRAIN_MCP_PUBLIC_HOSTNAME}
      CADDY_EMAIL: ${CADDY_EMAIL}

volumes:
  brain_db:
  brain_backups:
  brain_redis:
  caddy_data:
  caddy_config:
  caddy_logs:
