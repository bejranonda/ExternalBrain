# Brain Platform — production overrides for a bare VM with a public IP.
#
# Compose-merges with deploy/docker-compose.yml. Use:
#
#   docker compose \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.prod.yml \
#     --env-file .env \
#     up -d --build
#
# Or wrap with `./scripts/deploy-prod.sh` which adds the migration + FTS
# + backfill steps + waits for Caddy's first certificate pull.
#
# Prereqs on the VM:
#   1. DNS A records for $BRAIN_PUBLIC_HOSTNAME and $BRAIN_MCP_PUBLIC_HOSTNAME
#      pointing at the VM's public IP.
#   2. Ports 80 and 443 open in the firewall (ACME HTTP-01 + HTTPS).
#   3. `.env` contains BRAIN_PUBLIC_HOSTNAME, BRAIN_MCP_PUBLIC_HOSTNAME,
#      CADDY_EMAIL, NODE_ENV=production, and all AUTH_* vars populated
#      (see deploy/PRODUCTION.md §"Environment checklist").

services:
  # Remove host-port bindings for web and mcp-server — Caddy is the
  # public entrypoint now. They stay on the compose-internal network
  # where only Caddy can reach them.
  web:
    ports: !override []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      ALLOW_DEV_AUTH_IN_PRODUCTION: ${ALLOW_DEV_AUTH_IN_PRODUCTION:-false}
      AUTH_URL: ${AUTH_URL:-https://${BRAIN_PUBLIC_HOSTNAME}}
      AUTH_TRUST_HOST: "true"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    volumes:
      # Read-only mount so the web container can stat the replicate-heartbeat
      # file for GET /api/admin/backup-status without any write access.
      - brain_backups:/data/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mcp-server:
    ports: !override []
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3100/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    restart: unless-stopped

  # Redis for cross-replica rate-limit state. Single-instance is fine
  # for a bare-VM deploy; scale to managed Redis (Upstash, ElastiCache)
  # if you go multi-host.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    volumes:
      - brain_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    # Don't expose Postgres to the public IP in prod. If you need
    # external access, tunnel via SSH.
    ports: !override []

  # Nightly pg_dump via cron. Writes to `brain_backups` volume.
  # To restore: scripts/backup-restore.sh
  backup:
    image: prodrigestivill/postgres-backup-local:15
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - brain_backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-brain}
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      SCHEDULE: "0 3 * * *"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"

  # Off-host backup replication — opt-in via the `backup-replicate` profile.
  #
  # Watches the brain_backups volume (written by the `backup` sidecar) and
  # periodically syncs its contents to a remote storage bucket using rclone.
  # Supports S3, Cloudflare R2, Backblaze B2, and any other rclone backend.
  #
  # Prerequisites:
  #   1. Create deploy/rclone.conf (gitignored; chmod 600) with your provider
  #      credentials. Run `scripts/setup-backup-replicate.sh` for a guided setup.
  #   2. Set BACKUP_REMOTE in .env (e.g. "s3-r2:my-bucket/brain-prod").
  #   3. Activate the profile: COMPOSE_PROFILES=tls,backup-replicate ./scripts/deploy-prod.sh
  #
  # See docs/RUNBOOK.md §"Off-host backup replication" for full setup steps.
  backup-replicate:
    profiles: ["backup-replicate"]
    image: rclone/rclone:1
    restart: unless-stopped
    depends_on:
      backup:
        condition: service_started
    volumes:
      - brain_backups:/data/backups:ro
      - ./rclone.conf:/config/rclone/rclone.conf:ro
    environment:
      RCLONE_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_INTERVAL: ${BACKUP_INTERVAL:-3600}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          if [ -n "$$RCLONE_REMOTE" ]; then
            rclone sync /data/backups "$$RCLONE_REMOTE" --quiet \
              && echo "$$(date -u): synced to $$RCLONE_REMOTE" \
              || echo "$$(date -u): sync FAILED to $$RCLONE_REMOTE" >&2
            echo "$$(date -u +%s)" > /data/backups/.replicate-heartbeat 2>/dev/null || true
          else
            echo "$$(date -u): RCLONE_REMOTE not set — skipping sync"
          fi
          sleep "$$RCLONE_INTERVAL"
        done

  caddy:
    # Custom Caddy build with the mholt/caddy-ratelimit plugin baked in.
    # Audit C14 (#110): the prod Caddyfile uses `rate_limit`, which the
    # stock caddy:2-alpine image doesn't ship. See Caddyfile.Dockerfile
    # for the build (xcaddy --with github.com/mholt/caddy-ratelimit).
    build:
      context: ..
      dockerfile: deploy/Caddyfile.Dockerfile
    image: brain/caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"      # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      BRAIN_PUBLIC_HOSTNAME: ${BRAIN_PUBLIC_HOSTNAME}
      BRAIN_MCP_PUBLIC_HOSTNAME: ${BRAIN_MCP_PUBLIC_HOSTNAME}
      CADDY_EMAIL: ${CADDY_EMAIL}

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  brain_backups:
  brain_redis:
