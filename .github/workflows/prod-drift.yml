name: prod-drift

# "Green on main ≠ live" alarm. The v1.2.x stale-deploy incident: a React #418
# fix sat merged on main for two days while production ran an older build —
# the bug looked alive and cost a diagnosis session. Deploys here are
# deliberately human-run (scripts/deploy.sh), so this watchdog closes the gap
# the other way: once a day it compares the deployed version (from
# /api/healthz, baked via git describe at build time) against main's
# git describe, and keeps exactly one "prod is behind main" issue open while
# they differ. In-sync (or no BRAIN_DEPLOY_URL secret — e.g. a fork with no
# deployment) → green no-op and any open drift issue is closed.
#
# BRAIN_DEPLOY_URL is a SECRET, not a variable: this repo deliberately does
# not publish its deployment hostname, and workflow logs are public — secrets
# are masked there.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: deployed vs main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_URL: ${{ secrets.BRAIN_DEPLOY_URL }}
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare deployed version to main
        id: drift
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "BRAIN_DEPLOY_URL secret not set — nothing to watch (fork or no deployment). Skipping."
            echo "state=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DEPLOYED=$(curl -fsS --max-time 10 "$DEPLOY_URL/api/healthz" | jq -r '.version // empty')
          # #62 hardening: the value is build-time baked (git describe) and so
          # trusted in practice, but it crosses a network boundary — strip
          # newlines and cap length so a hostile response can't forge step
          # outputs ($GITHUB_OUTPUT is line-delimited) or bloat issue bodies.
          DEPLOYED=$(printf '%s' "$DEPLOYED" | tr -d '\n\r' | head -c 64)
          if [ -z "$DEPLOYED" ]; then
            # Older deployment without the version field, or unreachable —
            # surface as drift-unknown rather than failing the run red.
            echo "healthz returned no version (pre-version build or unreachable)."
            echo "state=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAIN=$(git describe --tags --always origin/main)
          echo "deployed=$DEPLOYED" >> "$GITHUB_OUTPUT"
          echo "main=$MAIN" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOYED" = "$MAIN" ]; then
            echo "state=in_sync" >> "$GITHUB_OUTPUT"
            echo "In sync: deployed=$DEPLOYED main=$MAIN"
          elif git rev-parse -q --verify "$DEPLOYED^{commit}" >/dev/null 2>&1 \
            && [ -z "$(git diff --name-only "$DEPLOYED"..origin/main -- . | grep -vE '^(docs/|REBUILD/|\.github/|scripts/|packages/core/generation-uplift/|[^/]+\.md$|\.env\.example$)')" ]; then
            # Not-app-served drift (#140 false-positive class): every file between
            # the deployed build and main is something production never runs, so
            # nothing merged is missing from prod. Treated as in-sync so the issue
            # closes instead of nagging. The excluded set, and why each is safe:
            #   docs/, REBUILD/, root *.md  — GitHub serves these from the repo.
            #   .github/                    — CI config; never enters an image.
            #   packages/core/generation-uplift/ — operator-run benchmark
            #       artifacts, deliberately outside src/ so neither the package
            #       tsconfig nor vitest picks them up (GUIDELINES §4). Never built.
            #   .env.example                — a template. The container reads the
            #       real .env; a genuinely new runtime var also touches
            #       deploy/docker-compose.yml, which is NOT excluded and so still
            #       trips drift.
            #   scripts/                    — operator tooling. Verified 2026-08-01
            #       that deploy/Dockerfile never COPYs it and /app/scripts is
            #       absent from the web, worker and mcp-server images. Scripts run
            #       from the checkout, so `git pull` applies them immediately —
            #       there is no deploy that would make them "live". Note
            #       deploy/docker-compose.yml and deploy/Dockerfile are NOT under
            #       this path and still trip drift, correctly.
            # Added 2026-07-31 after #176: v2.4.0 was a docs + benchmark release
            # that correctly wasn't deployed, but .env.example and the
            # generation-uplift/ artifacts survived the old filter and opened a
            # false drift issue. Verified both ways — v2.3.1..v2.4.0 now filters
            # to empty, while v2.4.0..v2.5.0 (a real kra/oracle change) still
            # reports drift.
            echo "state=in_sync" >> "$GITHUB_OUTPUT"
            echo "Docs-only drift (deployed=$DEPLOYED main=$MAIN) — treated as in sync."
          else
            echo "state=drift" >> "$GITHUB_OUTPUT"
            echo "DRIFT: deployed=$DEPLOYED main=$MAIN"
          fi

      - name: Open/update or close the drift issue
        if: steps.drift.outputs.state == 'drift' || steps.drift.outputs.state == 'in_sync'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.drift.outputs.state }}
          DEPLOYED: ${{ steps.drift.outputs.deployed }}
          MAIN: ${{ steps.drift.outputs.main }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label prod-drift --state open --json number --jq '.[0].number // empty')
          if [ "$STATE" = "drift" ]; then
            # printf-composed so every source line stays indented inside this
            # YAML block scalar — a multi-line shell string with column-1
            # continuation lines terminates the block and invalidates the
            # whole workflow file (#54: GitHub then registers it trigger-less).
            BODY=$(printf '%s\n' \
              "Production is running \`$DEPLOYED\` but \`main\` is at \`$MAIN\`." \
              "" \
              "Merged work is not live. Deploy when convenient:" \
              "" \
              '```bash' \
              "git pull --ff-only && ./scripts/deploy.sh" \
              '```' \
              "" \
              "_This issue is managed by the \`prod-drift\` workflow — it updates daily while drift persists and closes itself once production matches \`main\`._")
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still drifting: deployed \`$DEPLOYED\`, main \`$MAIN\`."
            else
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "prod-drift: production is behind main" \
                --label prod-drift \
                --body "$BODY"
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
                --comment "Back in sync: production and \`main\` are both at \`$DEPLOYED\`."
            fi
          fi
