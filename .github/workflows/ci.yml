name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Audit O4 (#103): restrict GITHUB_TOKEN to the minimum scope CI needs.
# Without this, jobs run at the repo's default scope (often
# `contents: write`), which a compromised action could exfiltrate or
# misuse. CI here only reads code; explicit `contents: read` makes that
# the contract.
permissions:
  contents: read

jobs:
  doc-refs:
    name: doc refs (no phantom PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `gh pr list` (the ceiling lookup) needs pull-requests: read on top of the
    # workflow-wide contents: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check public docs for phantom PR/issue references
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-doc-refs.sh

  dep-audit:
    name: dependency audit (critical, prod only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Added 2026-08-12 after a *critical* next-auth/@auth/core CVE
    # (GHSA-7rqj-j65f-68wh — homoglyph email-normalisation bypass) sat
    # unnoticed in the deployed auth path. The patched versions had been on
    # npm the whole time and the existing semver range already permitted
    # them; nothing re-resolved because nothing ran an audit. Caught by a
    # manual pass, not a gate — see KNOWN_ISSUES §0aj.
    #
    # Deliberately narrow, so that a red run always means "act now":
    #   --prod          skips devDependencies. The ~70 moderate/high findings
    #                   in this repo are @prisma/dev's tree (local Prisma
    #                   Studio tooling), which never reaches the deployed
    #                   image. Auditing them would make this job permanently
    #                   red, and a permanently-red gate trains people to
    #                   ignore it — the failure mode KNOWN_ISSUES §0ak calls
    #                   out for flaky tests, applied to security noise.
    #   --audit-level critical
    #                   `high` currently exits 1 on pre-existing transitive
    #                   findings with no available fix. Gating on critical
    #                   keeps the signal actionable; raise the bar once the
    #                   high tier is genuinely clean.
    #
    # Verified non-vacuous before merge: this command exits 1 against the
    # pre-patch lockfile and 0 against the current one.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # `--frozen-lockfile` matters here: the audit must describe the tree the
      # repo actually ships, not whatever a fresh resolution would pick today.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies for critical advisories
        run: pnpm audit --prod --audit-level critical

  benchmark-coherence:
    name: benchmark ↔ docs coherence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only meaningful on a PR — it compares against the base branch. ROADMAP
    # listed this gate as shipped from 2026-07 while it did not exist; built
    # 2026-08-01. Enforces GUIDELINES §3 invariant 12: a change to kra.ts's
    # WEIGHTS or CANDIDATE_POOL_SIZE needs the benchmark re-run and recorded in
    # docs/VALIDATION.md in the same PR.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (full history — the check diffs constant values vs base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Read-only job: it only reads history. Don't leave GITHUB_TOKEN in
          # the local git config for the rest of the run (zizmor: artipacked).
          persist-credentials: false
      - name: Retrieval tuning must ship with a benchmark record
        # Base ref via env, never interpolated into the shell command.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-benchmark-coherence.sh "origin/${BASE_REF}"

  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # #233 — give the verify job a real pgvector service so DB-gated
    # tests stop silent-skipping. Before this, the IDOR regression net
    # (cross-user-isolation.test.ts) was gated on `await reachable()`
    # which failed without a real DB and tripped describe.skip — green
    # CI hid that 5 IDOR tests never ran. With a real pgvector here,
    # both DB-gated test files (cross-user-isolation, session-lifecycle,
    # kea-audit-writes, kea-cross-extract, installer-templates-reconcile)
    # execute against the actual schema.
    #
    # Cost: ~15s for postgres boot + migrate-deploy. Buys: regression
    # coverage for closed CVE-class IDOR cluster (#106).
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://brain:brain@localhost:5432/brain
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        # `exec` prefix is load-bearing on pnpm 9: `pnpm --filter @brain/db prisma ...`
        # looks for a "prisma" package.json script, doesn't find one, and silently
        # no-ops — leaving src/generated/client/ empty and breaking every typecheck
        # that imports Prisma types. Same reason scripts/deploy*.sh use `exec`.
        run: pnpm --filter @brain/db exec prisma generate

      # #233 — apply migrations against the real DB before tests run so
      # DB-gated test files have the schema they need.
      - name: Migrate test DB (fresh-DB gate) + FTS indexes
        env:
          PGPASSWORD: brain
        run: |
          psql -h localhost -U brain -d brain -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          # This IS the fresh-DB migrate gate (#37/#36): the service container
          # starts empty every run, so the full migration history applies
          # front-to-back exactly like a day-zero deploy. Formerly a separate
          # `fresh-deploy` job — folded in (2026-06-09) because both jobs ran
          # identical migrate steps on identical empty DBs; the only unique
          # step was the FTS DDL below (mirrors scripts/deploy.sh §3).
          pnpm --filter @brain/db exec prisma migrate deploy
          psql -h localhost -U brain -d brain -f packages/db/sql/session-fts-index.sql

      - name: Typecheck
        run: pnpm turbo run typecheck

      # Broadened from `--filter @brain/core test` to `turbo run test` so any
      # new package that adds a `test` script is automatically covered (#37).
      # #233: DB-gated tests now execute (no more silent skip).
      - name: Test
        run: pnpm turbo run test

      # Broadened from per-package `--filter` invocations to `turbo run build`,
      # which builds all six packages (was only web/mcp-server/worker before).
      # Catches build regressions in @brain/core, @brain/db, @brain/types
      # that previously slipped through (#37).
      - name: Build
        run: pnpm turbo run build
